---
name: Windows CI
on:
  push:
    branches: ['dev', 'main']
  pull_request:
    branches: ['dev', 'main']
jobs:
  build:
    runs-on: windows-latest
    env:
      NAME: ${{ github.repository.name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: .\install.ps1

      - name: Build app
        shell: pwsh
        run: .\build.ps1

      - name: Archive app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: .\dist

      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NAME }}
